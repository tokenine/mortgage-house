version: '3.9'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: mortgage-house-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Uncomment and configure as needed:
      # - NEXT_PUBLIC_API_URL=http://localhost:8000
      # - NEXT_PUBLIC_WEB3_PROVIDER=https://rpc.ankr.com/eth
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mortgage-network

networks:
  mortgage-network:
    driver: bridge
